<!DOCTYPE html>
<html>
<head>
<style>
    body {
  text-align: center;
}


#display {
  font-size:40px;
  margin:20px;
  
}
button {
  padding:10px;
  margin:5px;
}
</style>
</head>
<body>

<div id="display">00:00:00</div>

<button onclick="start()">START</button>
<button onclick="pause()">PAUSE</button>
<button onclick="reset()">RESET</button>

<script>
let sec = 0;
let timer = null;

function updateDisplay() {
  let hrs = String(Math.floor(sec / 3600)).padStart(2,'0');
  let min = String(Math.floor((sec % 3600) / 60)).padStart(2,'0');
  let s = String(sec % 60).padStart(2,'0');
  document.getElementById("display").innerHTML =
      hrs + ":" + min + ":" + s;
}

function start() {
  if(timer !== null) return;
  timer = setInterval(function(){
    sec++;
    updateDisplay();
  },1000);
}

function pause() {
  clearInterval(timer);
  timer = null;
}

function reset() {
  pause();
  sec = 0;
  updateDisplay();
}
</script>

</body>
</html>
