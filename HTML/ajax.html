<!DOCTYPE html>
<html>
    <head>
        <title>AJAX</title>
    </head>
    <body>
        <h2>Book List AJAX</h2>
        <button onclick="loadData()">Fetch</button>
        <div id="output"></div>
    </body>
    <script>
        function loadData() {
            var xhttp = new XMLHttpRequest();

            xhttp.onreadystatechange = function() {
                if(this.readyState == 4 && this.status == 200) {
                    var data = JSON.parse(this.responseText);

                    var out = "<h2>Books</h2><h3>Pascal Book</h3>";

                    for(var i=0; i<data.Pascal.length; i++)
                        out += data.Pascal[i].Name + " - Rs." + data.Pascal[i].price + "<br>";

                    out += "<h3>Scala Book</h3>";

                    for(var i=0; i<data.Scala.length; i++)
                        out += data.Scala[i].Name + " - Rs." + data.Scala[i].price + "<br>";

                    document.getElementById("output").innerHTML = out;
                }
            };
            xhttp.open("GET", "books.json", true);
            xhttp.send();
        }
    </script>
</html>
