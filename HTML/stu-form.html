<!DOCTYPE html>
<html>
<head>  
    <title></title>
    <style>
        body {text-align: center;}
    </style>
</head>
<body>  
    <h2>XYZ College/School</h2>
    <h3>Student Registration Form</h3>

    <form>
        <label>Student Image:</label>
        <input type="file" accept="image/*"> (less than 5 Mb)
        <br><br>

        <label>Student Name:</label>
        <input type="text" placeholder="FullName" required>
        <br><br>

        <label>Father's Name:</label>
        <input type = "text" placeholder = "Father's Full Name" required>
        <br><br>

        <label>Mother's Name:</label>
        <input type = "text" placeholder = "Mother's Full Name" required>
        <br><br>

        <label>Gender:</label>
        <input type = "radio" name = "gender"> Male
        <input type = "radio" name = "gender"> Female
        <input type = "radio" name = "gender"> Others
        <br><br>

        <label>Date of Birth:</label>
        <input type = "date">
        <br><br>

        <label>E-mail:</label>
        <input type = "email" placeholder="email@xyz.com">
        <br><br>

        <label>Levels:</label>
        <select>
            <option>High School</option>
            <option>Undergraduate</option>
            <option>Postgraduate</option>
        </select>
        <br><br>

        <label>Department</label>
        <select>
            <option>ECE</option>
            <option>CSE</option>
            <option>ME</option>
            <option>CE</option>
        </select>
        <br><br>

        <label>Tel/Mobile</label>
        <input type = "tel" placeholder = "xxx xxx xxxx">
        <br><br>

        <input type = "submit" value = "Register">
        <input type = "reset" value = "Reset">
        <br><br>
        
    </form>
</body>
</html>
