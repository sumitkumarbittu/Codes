<!DOCTYPE html>
<html>
    <head>
        <title>Day & Time</title>
    </head>
    <body>
        <h2>Current Day and Time</h2>
        <button onclick="dayTime()">Fetch</button>
        <p id="output"></p>
    </body>
    <script>
        function dayTime() {
            var today = new Date();

            var days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

            var day = today.getDay();
            var h = today.getHours();
            var m = today.getMinutes();
            var s = today.getSeconds();

            var p = h >= 12 ? "PM" : "AM"; 

            if(h == 0)
                h = 12;

            var out = "Current Day: " + days[day] + "<br>";

            out += "Current Time: " + h + " "+ p + " : " + m + " : " + s;

            document.getElementById("output").innerHTML = out;
        }
    </script>
</html>
